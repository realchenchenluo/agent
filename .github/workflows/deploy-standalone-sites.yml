name: Deploy standalone demo sites

on:
  push:
    branches: [main]
    paths:
      - "chenchen/holdings-intake/site/**"
      - "chenchen/fund-market-analysis/site/**"
      - "chenchen/versions/risk-workbench.html"
      - "chenchen/versions/risk-workbench.js"
      - "chenchen/versions/common.js"
      - "chenchen/versions/style.css"
      - "chenchen/versions/product-overrides.css"
      - "chenchen/data/risk-workbench-demo.json"
      - ".github/workflows/deploy-standalone-sites.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble standalone demo sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/holdings-intake _site/fund-market-analysis _site/risk-workbench
          cp -R chenchen/holdings-intake/site/. _site/holdings-intake/
          cp -R chenchen/fund-market-analysis/site/. _site/fund-market-analysis/
          cp chenchen/versions/risk-workbench.html _site/risk-workbench/index.html
          cp chenchen/versions/risk-workbench.js _site/risk-workbench/risk-workbench.js
          cp chenchen/versions/common.js _site/risk-workbench/common.js
          cp chenchen/versions/style.css _site/risk-workbench/style.css
          cp chenchen/versions/product-overrides.css _site/risk-workbench/product-overrides.css
          cp chenchen/data/risk-workbench-demo.json _site/risk-workbench/risk-workbench-demo.json
          sed -i \
            -e 's#/versions/style.css#./style.css#g' \
            -e 's#/versions/product-overrides.css#./product-overrides.css#g' \
            -e 's#/versions/risk-workbench.js#./risk-workbench.js#g' \
            -e 's#href="/investment"#href="../"#g' \
            _site/risk-workbench/index.html
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal AI Fund Manager · 独立演示</title><style>body{margin:0;background:#f4f6f7;color:#18232b;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{width:min(760px,calc(100% - 36px));margin:12vh auto}h1{font-size:clamp(30px,5vw,54px);letter-spacing:-.05em}p{color:#71808a;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}a{display:block;padding:22px;border:1px solid #dce4e8;border-radius:14px;background:#fff;color:#18232b;text-decoration:none}a:hover{border-color:#233d52}strong,small{display:block}small{margin-top:8px;color:#71808a}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><p>PERSONAL AI FUND MANAGER · STANDALONE DEMOS</p><h1>三个独立实验网站</h1><p>每个 Demo 独立运行，先验证边界和体验，再决定是否并入主产品。</p><div class="grid"><a href="./holdings-intake/"><strong>持仓导入台</strong><small>上传、预览、校验和确认</small></a><a href="./fund-market-analysis/"><strong>基金市场雷达</strong><small>市场状态、观察项和证据</small></a><a href="./risk-workbench/"><strong>风控工作台 Demo</strong><small>Core Agent → Risk 只读交接</small></a></div></main></body></html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
